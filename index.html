<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wigglesworth — Update Countdown</title>
<meta name="description" content="Counting down to the next Wigglesworth update.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Wigglesworth">
<meta property="og:title" content="Wigglesworth — Update Countdown">
<meta property="og:description" content="Counting down to the next Wigglesworth update.">
<meta property="og:url" content="https://wigglesworth-countdown.onrender.com/">
<meta property="og:image" content="https://wigglesworth-countdown.onrender.com/banner.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#000;color:#f02030;font-family:Caveat,cursive;display:flex;justify-content:center;align-items:center;padding:24px;min-height:100vh}
.stage{text-align:center;transform:rotate(-2deg);max-width:900px}
.kicker{font-size:clamp(28px,5vw,44px);opacity:.85}
.big{font-size:clamp(64px,14vw,150px);font-weight:700;line-height:1;margin:6px 0 2px;text-shadow:0 0 26px rgba(240,32,48,.35)}
.sub{font-size:clamp(26px,4.5vw,40px);opacity:.9}
.vid{transform:rotate(0);width:min(92vw,860px);margin:0 auto}
.vid iframe,.vid video{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}
.snd{position:fixed;left:50%;transform:translateX(-50%) rotate(-2deg);bottom:26px;z-index:20;font-family:Caveat,cursive;font-size:30px;color:#f02030;cursor:pointer;text-shadow:0 0 14px rgba(240,32,48,.5)}
.erow2{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.erow2 button{background:transparent;color:#f02030;border:1.5px solid #f02030;border-radius:999px;padding:11px 26px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;letter-spacing:1px;cursor:pointer}
.erow2 button:hover{background:#f02030;color:#000}
body.playing{padding:0}
body.playing .stage{max-width:none;width:100vw;transform:none}
body.playing .vid{width:100vw;margin:0}
body.playing .vid iframe,body.playing .vid video{height:100vh;height:100dvh;aspect-ratio:auto;border-radius:0;object-fit:cover}
#editLink{position:fixed;right:14px;bottom:12px;color:#4a0d15;background:none;border:0;cursor:pointer;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:1px}
#editLink:hover{color:#f02030}
#epanel{position:fixed;inset:0;z-index:50;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.85);padding:16px}
#epanel.open{display:flex}
.ecard{width:100%;max-width:430px;background:#0d0d12;border:1px solid #3a0d14;border-radius:14px;padding:22px;color:#f5ecec;font-family:"Segoe UI",system-ui,sans-serif}
.ecard h2{font-family:Caveat,cursive;color:#f02030;margin:0 0 4px;font-size:34px}
.ecard label{display:block;font-size:11px;letter-spacing:1px;color:#a49dae;margin:14px 0 5px;text-transform:uppercase}
.ecard input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #3a0d14;background:#000;color:#f5ecec;font-size:14px;color-scheme:dark}
.erow{display:flex;gap:8px;margin-top:16px}
.erow button{flex:1;padding:11px;border-radius:9px;border:0;font-weight:800;cursor:pointer}
#esave{background:#f02030;color:#fff}
#eclose{background:transparent;color:#a49dae;border:1px solid #3a3348}
#emsg{font-size:13px;min-height:18px;margin-top:10px;color:#f02030}
#dropbox{border:1.5px dashed #6e1424;border-radius:12px;padding:20px 14px;text-align:center;font-family:Caveat,cursive;font-size:26px;color:#f02030;cursor:pointer;margin-top:4px}
#dropbox span{display:block;font-family:"Segoe UI",system-ui,sans-serif;font-size:12px;color:#a49dae;margin-top:4px}
#dropbox.hot{border-color:#f02030;background:rgba(240,32,48,.07)}
</style>
</head>
<body>
<div class="stage">
  <div class="kicker" id="cdTitle">…</div>
  <div class="big" id="cdBig">…</div>
  <div class="sub" id="cdSub"></div>
</div>
<div class="snd" id="sndAmb" style="display:none" onclick="unmuteAmb()">tap for sound</div>
<button id="editLink" onclick="openEditor()">edit</button>
<script>
const API = 'https://wigglesworth-moderator-applications.onrender.com/api/config';
const ADMIN_API = 'https://wigglesworth-moderator-applications.onrender.com/api/admin/config';
const UPLOAD_API = 'https://wigglesworth-moderator-applications.onrender.com/api/admin/upload-video';
let endVideo = '';
const T = { days: 'day {d} left.', final: '{h}h {m}m {s}s left.', sub: '{h}h {m}m {s}s to go',
  done: 'completed.', end: 'that was it.', soon: 'soon.' };
function fmt(tpl, d, h, m, s){
  return String(tpl).split('{d}').join(d).split('{h}').join(h).split('{m}').join(m).split('{s}').join(s);
}
let ambAudio = null, ambUrl = '';
function startAmbience(url){
  stopAmbience();
  ambUrl = url || '';
  if(!/^https:\/\/[^"<>\s]+$/i.test(ambUrl)) return;
  ambAudio = new Audio(ambUrl);
  ambAudio.loop = true; ambAudio.muted = true;
  ambAudio.play().catch(() => {});
  const h = document.getElementById('sndAmb');
  if(h) h.style.display = 'block';
}
function stopAmbience(){
  if(ambAudio){ try{ ambAudio.pause(); }catch{} ambAudio = null; }
  const h = document.getElementById('sndAmb');
  if(h) h.style.display = 'none';
}
function unmuteAmb(){
  if(!ambAudio) return;
  ambAudio.muted = false;
  const h = document.getElementById('sndAmb');
  if(h) h.style.display = 'none';
}
document.addEventListener('click', () => {
  const p = document.getElementById('epanel');
  if(p && p.classList.contains('open')) return;
  if(ambAudio && ambAudio.muted) unmuteAmb();
});
function ytId(url){
  const m = String(url).match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([\w-]{6,})/);
  return m ? m[1] : '';
}
function showVideo(){
  const stage = document.querySelector('.stage');
  if(!/^https:\/\/[^"<>\s]+$/i.test(endVideo)){ completedFallback(); return; }
  if(ambAudio){ try{ ambAudio.pause(); }catch{} }
  document.body.classList.add('playing');
  const id = ytId(endVideo);
  if(id){
    stage.innerHTML = '<div class="vid"><iframe id="teaser" src="https://www.youtube.com/embed/' + id +
      '?autoplay=1&mute=1&controls=0&rel=0&enablejsapi=1" allow="autoplay; fullscreen" allowfullscreen frameborder="0"></iframe></div>'
      + '<div class="snd" id="snd" onclick="unmute()">tap for sound</div>';
    const fr = document.getElementById('teaser');
    fr.addEventListener('load', () => {
      try{ fr.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'addEventListener', args: ['onStateChange'] }), '*'); }catch{}
    });
  } else if(/\.(mp4|webm|ogg)(\?|#|$)/i.test(endVideo)){
    stage.innerHTML = '<div class="vid"><video id="teaser" src="' + endVideo.replace(/"/g, '') +
      '" autoplay muted playsinline disablepictureinpicture onended="showEndCard()"></video></div>'
      + '<div class="snd" id="snd" onclick="unmute()">tap for sound</div>';
  } else {
    completedFallback();
  }
}
if(!window._ytHooked){
  window._ytHooked = true;
  window.addEventListener('message', e => {
    let d; try{ d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; }catch{ return; }
    if(d && d.event === 'onStateChange' && d.info === 0) showEndCard();
  });
}
function escHtml(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function showEndCard(){
  try{ localStorage.setItem('cd_watched_' + (window._cdTarget || ''), '1'); }catch{}
  const stage = document.querySelector('.stage');
  stage.innerHTML = '<div class="big">' + escHtml(T.end) + '</div>'
    + '<div class="erow2"><button onclick="showVideo()">watch again</button>'
    + '<button onclick="backToCountdown()">back to countdown</button></div>';
}
function backToCountdown(){
  const stage = document.querySelector('.stage');
  stage.innerHTML = '<div class="kicker">' + escHtml(window._cdTitle || '') + '</div>'
    + '<div class="big">' + escHtml(T.done) + '</div><div class="sub"></div>'
    + '<div class="erow2"><button onclick="showVideo()">watch again</button></div>';
  if(ambAudio){ ambAudio.play().catch(() => {}); }
}
function unmute(){
  const v = document.getElementById('teaser');
  const s = document.getElementById('snd');
  if(v && v.tagName === 'VIDEO'){ v.muted = false; }
  else if(v){ v.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*'); }
  if(s) s.style.display = 'none';
}
function completedFallback(){
  document.getElementById('cdBig').textContent = T.done;
  document.getElementById('cdSub').textContent = '';
}
function render(target, title){
  window._cdTitle = title;
  const big = document.getElementById('cdBig');
  const sub = document.getElementById('cdSub');
  document.getElementById('cdTitle').textContent = title;
  let ms = target - Date.now();
  if(ms <= 0){ showVideo(); return false; }
  const d = Math.floor(ms / 86400000);
  const h = Math.floor(ms / 3600000) % 24;
  const m = Math.floor(ms / 60000) % 60;
  const s = Math.floor(ms / 1000) % 60;
  const p = n => String(n).padStart(2, '0');
  if(d > 0){ big.textContent = fmt(T.days, d, p(h), p(m), p(s)); sub.textContent = fmt(T.sub, d, p(h), p(m), p(s)); }
  else { big.textContent = fmt(T.final, d, p(h), p(m), p(s)); sub.textContent = ''; }
  return true;
}
function applyTexts(c){
  T.days = c.daysLine || T.days; T.final = c.finalLine || T.final; T.sub = c.subLine || T.sub;
  T.done = c.completedLine || T.done; T.end = c.endCardLine || T.end; T.soon = c.soonLine || T.soon;
}
fetch(API).then(r => r.json()).then(cfg => {
  const c = (cfg && cfg.countdown) || {};
  const t = Date.parse(c.target || '');
  const title = c.title || 'update';
  endVideo = (c.endVideo || '').trim();
  applyTexts(c);
  startAmbience(c.ambience || '');
  if(!c.show || !t){
    document.getElementById('cdTitle').textContent = title;
    document.getElementById('cdBig').textContent = T.soon;
    document.getElementById('cdSub').textContent = '';
    return;
  }
  window._cdTarget = t;
  document.getElementById('cdTitle').textContent = title;
  let watched = false;
  try{ watched = !!localStorage.getItem('cd_watched_' + t); }catch{}
  if(t - Date.now() <= 0){
    if(watched) showEndCard();
    else showVideo();
    return;
  }
  if(render(t, title)) setInterval(() => { if(!render(t, title)) return; }, 1000);
}).catch(() => {
  document.getElementById('cdTitle').textContent = 'update';
  document.getElementById('cdBig').textContent = T.soon;
  document.getElementById('cdSub').textContent = '';
});
// ---- staff editor (same edit code as the main site) ----
function ecode(){ return sessionStorage.getItem('cd_edit_code') || ''; }
function eheaders(){ return { 'Content-Type': 'application/json', 'x-edit-code': ecode() }; }
function isoToLocal(iso){
  const d = new Date(iso); if(isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function localToIso(v){ const d = new Date(v); return isNaN(d) ? '' : d.toISOString(); }
function openEditor(){
  let p = document.getElementById('epanel');
  if(!p){
    p = document.createElement('div'); p.id = 'epanel';
    p.innerHTML = '<div class="ecard"><h2>Countdown setup</h2><div id="eauth">'
      + '<label>Edit code (same as main site)</label><input id="ecode" type="password" placeholder="Enter edit code">'
      + '<div class="erow"><button id="eclose" onclick="closeEditor()">Cancel</button>'
      + '<button id="esave" onclick="unlockSave()">Unlock</button></div></div>'
      + '<div id="eform" style="display:none">'
      + '<label><input id="eshow" type="checkbox" class="echeck" style="width:auto"> Show countdown</label>'
      + '<label>Title</label><input id="etitle" placeholder="e.g. Update 2.0 drops in">'
      + '<label>Date &amp; time (your timezone)</label><input id="edate" type="datetime-local">'
      + '<label>End video — plays at zero (YouTube or .mp4 link)</label><input id="evideo" placeholder="https://…">'
      + '<label>Drop a teaser or ambience file</label>'
      + '<div id="dropbox">Drop MP4 / MP3 here<span>or click to browse · 60MB max · live in ~1 min</span><input id="evideofile" type="file" accept="video/mp4,video/webm,audio/mpeg,audio/ogg,audio/wav,audio/mp4,audio/x-wav" style="display:none"></div>'
      + '<div id="eupmsg" class="hint"></div>'
      + '<label>Spooky ambience — MP3 link, loops forever (empty for silence)</label><input id="eamb" placeholder="https://…/ambience.mp3">'
      + '<label>Words — {d}=days {h}=hours {m}=mins {s}=secs</label>'
      + '<input id="edays" placeholder="day {d} left.">'
      + '<input id="efinal" placeholder="{h}h {m}m {s}s left." style="margin-top:6px">'
      + '<input id="esub" placeholder="{h}h {m}m {s}s to go" style="margin-top:6px">'
      + '<input id="edone" placeholder="completed." style="margin-top:6px">'
      + '<input id="eend" placeholder="that was it." style="margin-top:6px">'
      + '<input id="esoon" placeholder="soon." style="margin-top:6px">'
      + '<div class="erow"><button id="eclose" onclick="closeEditor()">Close</button>'
      + '<button id="esave" onclick="unlockSave()">Save</button></div></div>'
      + '<div id="emsg"></div></div>';
    document.body.appendChild(p);
    document.getElementById('ecode').addEventListener('keydown', e => { if(e.key === 'Enter') unlockSave(); });
    const fz = document.getElementById('evideofile');
    fz.addEventListener('change', () => { if(fz.files[0]) uploadMedia(fz.files[0]); fz.value = ''; });
    const dz = document.getElementById('dropbox');
    dz.addEventListener('click', () => fz.click());
    ['dragover', 'dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('hot'); }));
    ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('hot'); }));
    dz.addEventListener('drop', e => {
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if(f) uploadMedia(f);
    });
  }
  document.getElementById('emsg').textContent = '';
  if(ecode()){ loadFull(); } else { showAuth(); }
  p.classList.add('open');
}
function closeEditor(){ document.getElementById('epanel').classList.remove('open'); }
function showAuth(){
  document.getElementById('eauth').style.display = 'block';
  document.getElementById('eform').style.display = 'none';
  document.querySelector('#epanel #esave').textContent = 'Unlock';
}
function emsg(t){ document.getElementById('emsg').textContent = t; }
function upmsg(t){ document.getElementById('eupmsg').textContent = t; }
async function uploadMedia(f){
  const okType = /^(video|audio)\//.test(f.type) || /\.(mp4|webm|mp3|ogg|wav|m4a)$/i.test(f.name);
  if(!okType){ upmsg('Video or MP3 only.'); return; }
  if(f.size > 60 * 1024 * 1024){ upmsg('Too big — 60MB max.'); return; }
  upmsg('Uploading ' + Math.round(f.size / 1048576) + 'MB…');
  try{
    const ct = /^audio\//.test(f.type) ? f.type : (/^video\//.test(f.type) ? f.type : (/\.(mp3|ogg|wav|m4a)$/i.test(f.name) ? 'audio/mpeg' : 'video/mp4'));
    const r = await fetch(UPLOAD_API, { method: 'POST', headers: { 'Content-Type': ct, 'x-edit-code': ecode() }, body: f });
    const j = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(j.error || 'Upload failed');
    const audioFile = /^audio\//.test(f.type) || /\.(mp3|ogg|wav|m4a)$/i.test(f.name);
    document.getElementById(audioFile ? 'eamb' : 'evideo').value = j.url;
    upmsg((audioFile ? 'Ambience' : 'Video') + ' uploaded — hit Save, live in about a minute.');
  }catch(err){ upmsg(err.message); }
}
async function unlockSave(){
  if(!ecode()){
    const v = document.getElementById('ecode').value.trim();
    if(!v){ emsg('Enter the edit code.'); return; }
    try{
      const r = await fetch(ADMIN_API, { headers: { 'x-edit-code': v } });
      if(!r.ok) throw 0;
      sessionStorage.setItem('cd_edit_code', v);
      loadFull();
    }catch{ emsg('Wrong code.'); }
    return;
  }
  await saveFull();
}
async function loadFull(){
  try{
    const r = await fetch(ADMIN_API, { headers: eheaders() });
    if(!r.ok) throw 0;
    const cfg = await r.json();
    const c = cfg.countdown || {};
    document.getElementById('eshow').checked = !!c.show;
    document.getElementById('etitle').value = c.title || '';
    document.getElementById('edate').value = isoToLocal(c.target);
    document.getElementById('evideo').value = c.endVideo || '';
    document.getElementById('eamb').value = c.ambience || '';
    document.getElementById('edays').value = c.daysLine || '';
    document.getElementById('efinal').value = c.finalLine || '';
    document.getElementById('esub').value = c.subLine || '';
    document.getElementById('edone').value = c.completedLine || '';
    document.getElementById('eend').value = c.endCardLine || '';
    document.getElementById('esoon').value = c.soonLine || '';
    window._fullCfg = cfg;
    document.getElementById('eauth').style.display = 'none';
    document.getElementById('eform').style.display = 'block';
    document.querySelector('#epanel #esave').textContent = 'Save';
    emsg('');
  }catch{ sessionStorage.removeItem('cd_edit_code'); showAuth(); emsg('Wrong code.'); }
}
async function saveFull(){
  if(!window._fullCfg){ emsg('Reload and unlock again.'); return; }
  const cfg = window._fullCfg;
  cfg.countdown = {
    show: document.getElementById('eshow').checked,
    title: document.getElementById('etitle').value,
    target: localToIso(document.getElementById('edate').value),
    endVideo: document.getElementById('evideo').value.trim(),
    ambience: document.getElementById('eamb').value.trim(),
    daysLine: document.getElementById('edays').value,
    finalLine: document.getElementById('efinal').value,
    subLine: document.getElementById('esub').value,
    completedLine: document.getElementById('edone').value,
    endCardLine: document.getElementById('eend').value,
    soonLine: document.getElementById('esoon').value,
  };
  try{
    const r = await fetch(ADMIN_API, { method: 'POST', headers: eheaders(), body: JSON.stringify(cfg) });
    if(!r.ok) throw 0;
    emsg('Saved — reloading…');
    setTimeout(() => location.reload(), 700);
  }catch{ emsg('Save failed — unlock again.'); }
}
</script>
</body>
</html>
