<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wigglesworth — Update Countdown</title>
<meta name="description" content="Counting down to the next Wigglesworth update.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Wigglesworth">
<meta property="og:title" content="Wigglesworth — Update Countdown">
<meta property="og:description" content="Counting down to the next Wigglesworth update.">
<meta property="og:url" content="https://wigglesworth-countdown.onrender.com/">
<meta property="og:image" content="https://wigglesworth-countdown.onrender.com/banner.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#14121a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{ --amber:#6cb8f0; --bg:#14121a; --card:#1e1a28; --line:#322c44; --text:#f4f1ea; --muted:#a49dae; }
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:28px 18px;color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);
  background-image:radial-gradient(800px 400px at 50% -10%,rgba(108,184,240,.14),transparent 65%);}
.wrap{width:100%;max-width:640px;text-align:center}
.art{width:100%;border-radius:18px;border:1px solid var(--line);display:block;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:2.4px;color:var(--amber);margin:26px 0 10px}
h1{font-family:Fraunces,Georgia,serif;font-weight:900;font-size:clamp(34px,6vw,54px);margin:0;line-height:1.02;letter-spacing:-1px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:26px 0 8px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 6px}
.cell b{display:block;font-family:Fraunces,Georgia,serif;font-weight:900;font-size:clamp(30px,7vw,52px);line-height:1}
.cell span{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:1.6px;color:var(--muted)}
.note{color:var(--muted);font-size:13.5px;min-height:20px}
.btn{display:inline-block;margin-top:18px;padding:14px 30px;border-radius:999px;background:var(--amber);color:#0c1a26;font-weight:800;font-size:15px;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.foot{margin-top:30px;color:var(--muted);font-size:12px;font-family:"IBM Plex Mono",ui-monospace,monospace}
@media(max-width:480px){.grid{gap:7px}.cell{padding:12px 4px}}
</style>
</head>
<body>
<div class="wrap">
  <img class="art" src="banner.png" alt="Wigglesworth">
  <div class="eyebrow">Wigglesworth update</div>
  <h1 id="cdTitle">Counting down…</h1>
  <div class="grid" id="cdGrid" style="display:none">
    <div class="cell"><b id="cdD">–</b><span>days</span></div>
    <div class="cell"><b id="cdH">–</b><span>hrs</span></div>
    <div class="cell"><b id="cdM">–</b><span>min</span></div>
    <div class="cell"><b id="cdS">–</b><span>sec</span></div>
  </div>
  <p class="note" id="cdNote">Loading…</p>
  <a class="btn" href="https://wigglesworth-moderator-applications.onrender.com/">Apply for staff</a>
  <div class="foot">Run by the Wigglesworth staff team</div>
</div>
<script>
const API = 'https://wigglesworth-moderator-applications.onrender.com/api/config';
const pad = n => String(n).padStart(2, '0');
function tick(target){
  let ms = target - Date.now();
  if(ms <= 0){
    document.getElementById('cdD').textContent = '0';
    document.getElementById('cdH').textContent = '00';
    document.getElementById('cdM').textContent = '00';
    document.getElementById('cdS').textContent = '00';
    document.getElementById('cdNote').textContent = 'The update is live — go play!';
    return false;
  }
  document.getElementById('cdD').textContent = Math.floor(ms / 86400000);
  document.getElementById('cdH').textContent = pad(Math.floor(ms / 3600000) % 24);
  document.getElementById('cdM').textContent = pad(Math.floor(ms / 60000) % 60);
  document.getElementById('cdS').textContent = pad(Math.floor(ms / 1000) % 60);
  document.getElementById('cdNote').textContent = 'Until ' + new Date(target).toLocaleString();
  return true;
}
fetch(API).then(r => r.json()).then(cfg => {
  const c = (cfg && cfg.countdown) || {};
  const t = Date.parse(c.target || '');
  if(!c.show || !t){
    document.getElementById('cdTitle').textContent = 'Next update date drops soon';
    document.getElementById('cdNote').textContent = 'Check back later — or join the team below.';
    return;
  }
  document.getElementById('cdTitle').textContent = c.title || 'Update drops in';
  document.getElementById('cdGrid').style.display = 'grid';
  if(tick(t)) setInterval(() => { if(!tick(t)) return; }, 1000);
}).catch(() => {
  document.getElementById('cdTitle').textContent = 'Next update date drops soon';
  document.getElementById('cdNote').textContent = 'Check back later — or join the team below.';
});
</script>
</body>
</html>
